# Test profile — activated explicitly via @ActiveProfiles("test") on
# HmsApplicationTests (not a same-named application.yaml on the test classpath, which
# would shadow rather than merge with the main application.yaml's datasource/redis/mail
# config). Same Postgres instance as dev (see CLAUDE.md — FindUserDataAspect's native
# queries use Postgres-specific SQL, so swapping engines for tests is out of scope here);
# just schema-validate instead of auto-migrate, and quieter logging.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  # HMS v5 — a 20-connection pool (the dev/prod default) is needless resource
  # contention for CI/local test runs, which don't see anywhere near dev/prod's
  # concurrent load. Independent of the base application.yaml's own pool-sizing
  # reasoning — this override exists purely so test runs aren't paying for capacity
  # they never use.
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5

logging:
  level:
    amalitech.hospital.management: INFO

app:
  rate-limit:
    # See RateLimitFilterConfig's Javadoc — the ~37 @SpringBootTest @AutoConfigureMockMvc
    # controller test classes collectively fire far more than any sane per-minute limit
    # through the real filter chain, all simulated from MockMvc's fixed 127.0.0.1.
    enabled: false
