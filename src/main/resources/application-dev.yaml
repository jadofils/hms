# Local development profile — active by default (see application.yaml's
# spring.profiles.active fallback). Schema is allowed to auto-migrate from the entities
# and SQL is logged for debugging.
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    amalitech.hospital.management: DEBUG

management:
  endpoint:
    health:
      # "when-authorized" (application.yaml's default) needs a real authenticated
      # principal to show per-dependency detail — there is none locally, so this
      # override just shows it unconditionally for local convenience.
      show-details: always
