spring:
  application:
    name: hms
  # dev/test/prod-specific overrides live in application-{profile}.yaml (ddl-auto,
  # show-sql, log levels) — this file is the shared base every profile loads on top of.
  # Defaults to "dev" when SPRING_PROFILES_ACTIVE isn't set (local/.env-driven runs);
  # tests instead activate "test" explicitly via @ActiveProfiles on HmsApplicationTests
  # rather than a second same-named application.yaml on the test classpath, which would
  # shadow (not merge with) this file's datasource/redis/mail config entirely.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Loads .env (project root) as a properties file so every ${VAR} placeholder below
  # actually resolves. Without this, Spring never reads .env at all — DB_URL "worked"
  # in the past only because spring-boot-docker-compose derives datasource connection
  # details straight from the running container, bypassing this placeholder entirely;
  # every other ${VAR} here (REDIS_*, ENCRYPTION_KEY, BCRYPT_ROUNDS, GMAIL_*, ...) was
  # silently unresolved until something actually required it.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HMS-Pool
      maximum-pool-size: 20
      # HMS v5 — bumped from 1: HikariCP's own docs recommend a fixed-size pool
      # (minimum-idle == maximum-pool-size) for predictable latency under bursty load,
      # and this pass adds two new bursty concurrent-connection-demand sources: the
      # mailTaskExecutor/patientProfileExecutor thread pools (AsyncConfig) and
      # PatientService.getPatient's parallel CompletableFuture fan-out. Not fully fixed
      # (== 20) to avoid over-provisioning idle connections for this project's actual
      # course-project load — 10 is a deliberate middle ground, not the textbook ideal.
      minimum-idle: 10
      connection-timeout: 20000    # ms — how long to wait for a connection before throwing
      idle-timeout: 30000          # ms — how long an idle connection sits before eviction
      max-lifetime: 1800000        # ms — 30 min, max lifetime of any connection

  jpa:
    # hibernate.ddl-auto and show-sql are set per-profile (application-dev/test/prod.yaml)
    # HMS v5 — open-in-view explicitly disabled below (was Spring Boot's unset default,
    # `true`). OSIV keeps a Hibernate session bound for the whole request, which is
    # exactly what let lazy-load N+1s fire silently during response serialization
    # instead of failing loudly at the point they actually happen — see every
    # `@EntityGraph` added this pass (docs/v5-report.md) for the specific sites this
    # was masking. Only safe to flip *after* those fixes land: every finder method a
    # controller-layer response walks lazy associations on now carries its own
    # `@EntityGraph`, so nothing here still needs OSIV's safety net.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          autocommit: false
        jdbc:
          fetch_size: 50
          batch_size: 20
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
  mail:
    host: ${GMAIL_HOST}
    port: ${GMAIL_PORT}
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # GraphQL configuration — real Spring for GraphQL properties (`spring.graphql.*`).
  # The dependency on the classpath is `spring-boot-starter-graphql` (Spring for
  # GraphQL), NOT graphql-java-kickstart's `graphql-spring-boot-starter` — this file
  # previously had a top-level `graphql.tools.*`/`graphql.servlet.*` block, which are
  # that *other* library's property keys and were silently ignored by the actual
  # dependency present. Every `*.graphqls` file found under `schema.locations` is
  # parsed and merged into one schema automatically (see `config/graphql/GraphQlConfig`
  # for the one thing that merge doesn't already cover: custom scalars).
  graphql:
    path: /graphql
    schema:
      locations: classpath:graphql/
    graphiql:
      # Bundled GraphiQL UI at /graphiql — a free, zero-setup fallback for manual
      # checks. Altair (or any other GraphQL client) needs none of this bundling; it
      # just needs this reachable, introspectable /graphql endpoint.
      enabled: true
  # Google OAuth2 login (HMS v4, Epic 4.1) — client-id/secret come from the downloaded
  # docs/client_secret_*.json, copied into .env (gitignored). This is Spring Security's
  # own `spring.security.*` namespace — a different YAML path from this project's own
  # top-level `security:` block below (JWT/bcrypt/encryption-key), which predates this
  # and isn't renamed to avoid touching every ${security....} reference elsewhere.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

# Redis (still useful for caching sessions, tokens, etc.)

# Security
security:
  bcrypt:
    rounds: ${BCRYPT_ROUNDS}
  jwt:
    expiry-hours: ${JWT_EXPIRY_HOURS}
  encryption-key: ${ENCRYPTION_KEY}

# Mail

# Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Application
app:
  page-size: ${APP_PAGE_SIZE}
  max-upload-size-mb: ${APP_MAX_UPLOAD_SIZE_MB}
  mail-from-name: ${GMAIL_FROM_NAME}
  # Used by EmailAspect/AuthService to build links inside outbound HTML emails
  # (reset-password deep link, "Open HMS"/nav-bar links, support mailto). Defaults are
  # safe for local dev; override via .env for staging/prod.
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  support-email: ${APP_SUPPORT_EMAIL:support@hms-hospital.com}
  # CORS (HMS v4, Epic 1.2) — see SecurityConfig.corsConfigurationSource.
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # How long a self-registration's email-verification link stays valid — see
  # UserService.createUser (generates it) / AuthService.verifyEmail (consumes it).
  email-verification-ttl-hours: ${APP_EMAIL_VERIFICATION_TTL_HOURS:24}
  # Thresholds MaintenanceService's two @ScheduledMaintenance tasks check on each run —
  # independent of how often the tasks themselves run (see ScheduledMaintenance's own
  # interval/unit attributes at each call site).
  maintenance:
    log-retention-days: ${APP_LOG_RETENTION_DAYS:30}
    idle-user-days: ${APP_IDLE_USER_DAYS:90}

# Error responses — GlobalExceptionHandler maps every exception to a clean ErrorResponse
# body, so Spring Boot's own error page should never actually be hit. This is defense in
# depth for the residual cases that bypass @ExceptionHandler entirely (e.g. a raw 404 to
# an unmapped URL) — without it, spring-boot-devtools overrides these to ALWAYS, putting
# a full stack trace in the JSON body of any error that does slip through.
server:
  error:
    include-stacktrace: never
    include-exception: false

# Swagger / OpenAPI — UI lands on the app root (http://localhost:8080/), JSON docs
# stay at the springdoc default. All actual API routes live under /api/v1/**.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /
    tags-sorter: alpha
    operations-sorter: method

# Actuator — deliberately only health/info/metrics/prometheus, never the full "*". This
# app handles patient PII and SecurityConfig currently permits every request unauthenticated
# (see that class's own Javadoc) — actuator endpoints inherit that, so env/beans/configprops/
# heapdump/threaddump (anything that could leak a secret, a bean graph, or a full heap) stay
# off; the four exposed here are read-only operational signal with nothing sensitive in them.
# Revisit this list together with SecurityConfig's permitAll() the day either one is locked
# down — they're the same underlying gap, not two separate decisions.
management:
  info:
    # Off by default in this Spring Boot version — without it, the info.app.* block
    # below (and build-info.properties' own build.* keys) never actually surfaces at
    # /actuator/info, regardless of the exposure.include list above.
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Which dependency (DB/Redis, both auto-detected — see HealthIndicator autoconfig,
      # no bespoke code needed) is actually down, not just the aggregate UP/DOWN status.
      # Overridden to "always" in dev (application-dev.yaml) for local convenience.
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Buckets for the built-in per-endpoint HTTP timer AND this project's own
        # @Timed("hms.rest.requests")/@Timed("hms.graphql.requests") (see MetricsConfig) —
        # without this a Prometheus histogram_quantile() query has nothing to bucket into.
        http.server.requests: true
        hms.rest.requests: true
        hms.graphql.requests: true

# Actuator's /actuator/info — build.* comes from spring-boot-maven-plugin's build-info
# goal (target/classes/META-INF/build-info.properties), picked up automatically; app.*
# below is this project's own addition on top of that.
info:
  app:
    name: ${spring.application.name}
    description: Hospital Management System — REST + GraphQL backend
